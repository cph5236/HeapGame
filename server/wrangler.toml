name = "heap-server"
main = "src/index.ts"
compatibility_date = "2024-03-01"
compatibility_flags = ["nodejs_compat"]

# Domain-sharded D1 databases. See docs/superpowers/runbooks/d1-sharding-kv-cache.md
# for provisioning + the one-time data move. Apply migrations via migrate-d1.yml.
[[d1_databases]]
binding = "DB_HEAP"
database_name = "heap_core"
database_id = "6c720154-e532-4ba5-854c-c361d556f9ed"
migrations_dir = "migrations/heap_core"

[[d1_databases]]
binding = "DB_SCORES"
database_name = "heap_scores"
database_id = "5e4ff42c-19b6-4fc0-b8ad-d2403e549d4d"
migrations_dir = "migrations/heap_scores"

[[d1_databases]]
binding = "DB_REWARDS"
database_name = "heap_rewards"
database_id = "e4455f98-49b5-4958-95f5-68889b545a05"
migrations_dir = "migrations/heap_rewards"

[[d1_databases]]
binding = "DB_TELEMETRY"
database_name = "heap_telemetry"
database_id = "10c8d42d-d08b-462e-a206-5d2767b39f8b"
migrations_dir = "migrations/heap_telemetry"

# Edge read cache (cache-aside / write-through over the heap + score repos).
[[kv_namespaces]]
binding = "CACHE"
id = "a507cae477684d78991295b61a54dcc6"

# Analytics Engine binding — uncomment when deploying to production.
# In local dev (wrangler dev) the AE stub is silently no-op; omitting the
# binding forces the fallback to D1Sink so logs land in the local DB.
[[analytics_engine_datasets]]
  binding = "LOGS"
  dataset = "heap_logs"

[vars]
# Comma-separated list of origins allowed to call the API from a browser.
# Use "*" to allow all (dev only). Tighten to your real production origin(s)
# before relying on the CORS allowlist as a security layer. Production should be:
#   ALLOWED_ORIGINS = "https://heap.example.com,capacitor://localhost,https://localhost"
ALLOWED_ORIGINS = "*"

# Per-IP rate limits (Workers Rate Limiting API). period must be 10 or 60.
# limit is tokens per period, counted per Cloudflare datacenter per key (key = client IP).

[[ratelimits]]
name = "RL_SCORES"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_PLACE"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_GLOBAL"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "RL_LOG"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 100
  period = 60

[[ratelimits]]
name = "RL_CODES"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_FEEDBACK"
namespace_id = "1006"
  [ratelimits.simple]
  limit = 5
  period = 60

# obscenity is imported by shared/playerName.ts; module resolution from shared/
# climbs to the repo root, never into server/node_modules. The Workers CI build
# installs only server/ deps, so alias the import to the local install.
[alias]
obscenity = "./node_modules/obscenity"

# ── Load-test staging ─────────────────────────────────────────────────────────
# A second Worker with its own D1 shards, KV namespace and Analytics Engine
# dataset, so load tests never touch production data. Note that Cloudflare's
# free-tier daily quotas are ACCOUNT-WIDE, so a run here still spends
# production's budget — see loadtest/README.md.
#
# Deploy:   npx wrangler deploy --env staging
# Migrate:  npx wrangler d1 migrations apply <db>_staging --remote --env staging
# Secrets:  npx wrangler secret put ADMIN_SECRET    --env staging
#           npx wrangler secret put LOADTEST_SECRET --env staging
#
# LOADTEST_SECRET enables the synthetic per-request rate-limit key in
# middleware/rateLimit.ts. It is deliberately absent from the production [vars]
# above, which makes that branch unreachable in production.
#
# Runbook: docs/superpowers/runbooks/loadtest-staging.md
[env.staging]
name = "heap-server-staging"

# Bindings (d1_databases, kv_namespaces, analytics_engine_datasets, ratelimits)
# and vars do NOT inherit from the top level and are repeated below. The
# top-level [alias] DOES apply to every environment — declaring an
# [env.staging.alias] is rejected by wrangler as an unexpected field and is
# unnecessary (verified: identical bundle size with and without it).

[[env.staging.d1_databases]]
binding = "DB_HEAP"
database_name = "heap_core_staging"
database_id = "a323e04c-1cf6-477f-8b2e-709d6b808db0"
migrations_dir = "migrations/heap_core"

[[env.staging.d1_databases]]
binding = "DB_SCORES"
database_name = "heap_scores_staging"
database_id = "946309ab-d994-4769-9280-031127a3b1c5"
migrations_dir = "migrations/heap_scores"

[[env.staging.d1_databases]]
binding = "DB_REWARDS"
database_name = "heap_rewards_staging"
database_id = "8577b2c3-8698-4645-a2a8-06fc9af55a26"
migrations_dir = "migrations/heap_rewards"

[[env.staging.d1_databases]]
binding = "DB_TELEMETRY"
database_name = "heap_telemetry_staging"
database_id = "ba9269bc-33c5-43da-b45a-46e8c93f3e1d"
migrations_dir = "migrations/heap_telemetry"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "b639188e2fdd472cbc216809414adb66"

# Separate dataset so load-test noise never reaches the crash-triage workflow,
# which reads heap_logs.
[[env.staging.analytics_engine_datasets]]
  binding = "LOGS"
  dataset = "heap_logs_staging"

[env.staging.vars]
ALLOWED_ORIGINS = "*"

# Same limits as production, so the limiter is exercised under load rather than
# bypassed. namespace_ids are 2001-2006 so staging never shares counters with
# production's 1001-1006.
[[env.staging.ratelimits]]
name = "RL_SCORES"
namespace_id = "2001"
  [env.staging.ratelimits.simple]
  limit = 10
  period = 60

[[env.staging.ratelimits]]
name = "RL_PLACE"
namespace_id = "2002"
  [env.staging.ratelimits.simple]
  limit = 30
  period = 60

[[env.staging.ratelimits]]
name = "RL_GLOBAL"
namespace_id = "2003"
  [env.staging.ratelimits.simple]
  limit = 300
  period = 60

[[env.staging.ratelimits]]
name = "RL_LOG"
namespace_id = "2004"
  [env.staging.ratelimits.simple]
  limit = 100
  period = 60

[[env.staging.ratelimits]]
name = "RL_CODES"
namespace_id = "2005"
  [env.staging.ratelimits.simple]
  limit = 10
  period = 60

[[env.staging.ratelimits]]
name = "RL_FEEDBACK"
namespace_id = "2006"
  [env.staging.ratelimits.simple]
  limit = 5
  period = 60
