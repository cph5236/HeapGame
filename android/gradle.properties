# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# @capacitor-community/admob's own android/build.gradle is not AGP 9 compatible.
# It ships inside node_modules, so an edit there would not survive `npm ci`;
# these are the official AGP opt-outs instead. Both are temporary — revisit when
# the plugin is fixed upstream, and note AGP 10 removes android.newDsl.
#
#   line 25  apply plugin: 'kotlin-android'
# Needs both flags, verified by removing each: without builtInKotlin=false AGP
# 9's own Kotlin support has already registered a 'kotlin' extension and the
# plugin collides with it; without newDsl=false KGP fails casting the new
# LibraryExtensionImpl to BaseExtension.
android.builtInKotlin=false
android.newDsl=false
#   line 40  proguardFiles getDefaultProguardFile('proguard-android.txt')
#            -> AGP 9 rejects it for bundling -dontoptimize.
# This one costs nothing: that buildType sets `minifyEnabled false`, and it is
# proguardFiles rather than consumerProguardFiles, so the file is applied
# neither to the plugin nor to us. The rejection is a static check on a dead
# line — our own R8 run is unaffected.
android.r8.proguardAndroidTxt.disallowed=false
