name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # Read-only on purpose. The review posts ONE summary comment, and that comment
    # goes through the GitHub App token the action mints via OIDC — not through
    # this block — so `pull-requests: read` is enough for it. Bumping to
    # `pull-requests: write` would only buy inline line-level comments, which on a
    # 40-file PR is more noise than signal. If inline comments are ever wanted,
    # that is the one line to change.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 0, not 1: the review diffs the PR against origin/main, which needs
          # main's history present. At depth 1 the reviewer can only read files
          # at HEAD and has no way to see what the PR actually changed.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No plugin: the review runs on the `code-review` skill built into the
          # CLI. The `code-review@claude-code-plugins` marketplace command used to
          # do this job and is deliberately gone — see the allowlist notes below.
          #
          # Always leave a visible comment so it's obvious the review ran, even on a
          # clean diff. track_progress posts/updates a tracking comment; use_sticky_comment
          # keeps it to a single comment across re-pushes.
          track_progress: true
          use_sticky_comment: true
          prompt: |
            Review this pull request with the built-in code-review skill:
            /code-review high ${{ github.event.pull_request.number }}

            Effort is pinned because the skill otherwise reuses the last level typed
            interactively, and CI has no such history. `--comment` is deliberately NOT
            passed: the skill reports its findings back to you and posts nothing itself,
            so relaying them is your job.

            Then ALWAYS post a single summary comment on the PR describing the outcome:
            - If it found issues, summarize them concisely (file:line — the problem — a
              suggested fix).
            - If it found NO issues, post a brief note saying the review found no problems
              (e.g. "✅ Reviewed the diff — no issues found.").
          # The tool allowlist must be spelled out IN FULL here, not as a delta.
          # The action emits its own `--allowedTools "<base>"` and then appends
          # whatever is in claude_args, so a second --allowedTools flag is
          # last-wins: passing just `Task` would silently REPLACE the base set and
          # strip Read/Grep/Glob, leaving the reviewer unable to read anything.
          # Listing everything is also correct if the CLI ever merges the two
          # flags instead — the list is then a harmless superset.
          #
          # Skill is what invokes `/code-review` at all, and its absence is why the
          # marketplace plugin is gone. Three runs, three denials of the same
          # shape, each one silent and each one leaving a green check on an
          # unreviewed PR:
          #   #126 — no Task: every reviewer subagent denied (6 denials, 2/7 todos).
          #   #177 — no gh, no TodoWrite: the plugin command's first step is a
          #          `gh pr view` eligibility check, so it died on move one
          #          (59 denials, $7.40, 1/3 todos, no findings at all).
          #   #177 again — with those granted it still could not invoke the plugin
          #          command (19 denials); it salvaged the run by falling back to
          #          the built-in skill, which reviewed well for $2.19. Invoking a
          #          slash command is itself a tool call, and neither Skill nor
          #          SlashCommand was granted.
          # So: keep the path that worked, and grant the tool that runs it.
          #
          # Task stays — the skill forks a subagent to do the finding pass when the
          # structured-findings tool isn't present, which is always the case here.
          # gh stays because a PR-number target is fetched with it.
          #
          # git diff/log/blame let the reviewer see the change and its history
          # rather than just the files at HEAD. Deliberately NOT granted:
          #   - git add/commit/rm/push — a reviewer has no business writing to the
          #     branch; the action's base set includes those only because it shares
          #     a tool list with fix-it mode.
          #   - gh pr comment / mcp__github_inline_comment__create_inline_comment —
          #     only reached under `--comment`, which we do not pass. Findings come
          #     back through the sticky tracking comment instead, which is the
          #     single-comment design documented above.
          #   - gh api — reads a lot, but can POST just as easily.
          claude_args: >-
            --allowedTools "Glob,Grep,LS,Read,Task,TodoWrite,Skill,SlashCommand,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_comment__update_claude_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

