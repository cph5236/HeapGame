name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # Read-only on purpose. The review posts ONE summary comment, and that comment
    # goes through the GitHub App token the action mints via OIDC — not through
    # this block — so `pull-requests: read` is enough for it. Bumping to
    # `pull-requests: write` would only buy inline line-level comments, which on a
    # 40-file PR is more noise than signal. If inline comments are ever wanted,
    # that is the one line to change.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 0, not 1: the review diffs the PR against origin/main, which needs
          # main's history present. At depth 1 the reviewer can only read files
          # at HEAD and has no way to see what the PR actually changed.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Always leave a visible comment so it's obvious the review ran, even on a
          # clean diff. track_progress posts/updates a tracking comment; use_sticky_comment
          # keeps it to a single comment across re-pushes.
          track_progress: true
          use_sticky_comment: true
          prompt: |
            Review this pull request by running:
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            The command is deliberately invoked WITHOUT `--comment`, so it will print its
            findings and post nothing itself. Relaying them is your job.

            Then ALWAYS post a single summary comment on the PR describing the outcome:
            - If you found issues, summarize them concisely (file:line — the problem — a
              suggested fix).
            - If you found NO issues, post a brief note saying the review found no problems
              (e.g. "✅ Reviewed the diff — no issues found.").
          # The tool allowlist must be spelled out IN FULL here, not as a delta.
          # The action emits its own `--allowedTools "<base>"` and then appends
          # whatever is in claude_args, so a second --allowedTools flag is
          # last-wins: passing just `Task` would silently REPLACE the base set and
          # strip Read/Grep/Glob, leaving the reviewer unable to read anything.
          # Listing everything is also correct if the CLI ever merges the two
          # flags instead — the list is then a harmless superset.
          #
          # Task is the fix. `/code-review:code-review` works by dispatching
          # parallel reviewer subagents; without Task every dispatch is denied and
          # the run ends early with an unfinished tracking comment and no findings
          # (observed on PR #126: permission_denials_count 6, 2 of 7 todos done).
          #
          # gh + TodoWrite are the SECOND half of that same lesson, found on PR
          # #177 (permission_denials_count 59, $7.40, 1 of 3 todos done). The
          # upstream command declares its own `allowed-tools` — every `gh` verb
          # below — but this flag is last-wins over that frontmatter, so none of
          # them survived. Its step 1 is a `gh pr view` eligibility check, so the
          # run died on its first move; it also opens with "Create a todo list
          # before starting" and says "Use gh CLI to interact with GitHub ... Do
          # not use web fetch". Mirror the upstream list when it changes:
          # https://github.com/anthropics/claude-code/blob/main/plugins/code-review/commands/code-review.md
          #
          # git diff/log let the reviewer see the diff rather than just the files
          # at HEAD. Deliberately NOT granted:
          #   - git add/commit/rm/push — a reviewer has no business writing to the
          #     branch; the action's base set includes those only because it shares
          #     a tool list with fix-it mode.
          #   - gh pr comment / mcp__github_inline_comment__create_inline_comment —
          #     the command only reaches for these under `--comment`, which we do
          #     not pass. Findings come back through the sticky tracking comment
          #     instead, which is the single-comment design documented above.
          claude_args: >-
            --allowedTools "Glob,Grep,LS,Read,Task,TodoWrite,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_comment__update_claude_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

